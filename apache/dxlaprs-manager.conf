<VirtualHost *:14501>

    ServerName localhost

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Mantiene l'informazione HTTPS proveniente dal
    # reverse proxy esterno quando presente.
    RequestHeader set X-Forwarded-Host "%{Host}s"

    IncludeOptional /etc/apache2/dxlaprs-active-route.conf

    ErrorLog ${APACHE_LOG_DIR}/dxlaprs-error.log
    CustomLog ${APACHE_LOG_DIR}/dxlaprs-access.log combined

</VirtualHost>
